name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The unit tests mock all external media/AI *calls*, but the app modules
      # still import their libraries at module load, so the full runtime deps
      # are required for test collection. No system ffmpeg/ImageMagick needed
      # (no actual rendering happens in the tests).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4

      - name: Lint (ruff)
        run: ruff check app webui main.py scripts tests

      - name: Run tests (pytest)
        run: pytest
