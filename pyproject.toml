[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdvideo"
version = "0.1.0"
description = "An all-in-one AI short-video generator: topic in, finished HD short video out."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "video", "shorts", "tiktok", "text-to-speech", "moviepy", "automation"]

dependencies = [
    # Web / API
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "streamlit==1.41.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    # HTTP
    "httpx==0.28.1",
    "requests==2.32.3",
    # AI / LLM providers
    "openai==1.59.6",
    "google-generativeai==0.8.3",
    # YouTube upload (official Data API v3)
    "google-api-python-client==2.158.0",
    "google-auth-oauthlib==1.2.1",
    # Pinned to a version with prebuilt wheels for older macOS (x86_64).
    "cryptography==44.0.1",
    # Text-to-speech
    "edge-tts==7.3.1",
    # Video / audio (moviepy 2.x renders text via Pillow; no ImageMagick needed)
    "moviepy==2.2.1",
    "imageio-ffmpeg==0.5.1",
    "Pillow==11.3.0",
    # Config / utils
    "toml==0.10.2",
    "loguru==0.7.3",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[project.scripts]
vdvideo = "main:main"

[project.urls]
Repository = "https://github.com/isaacsvb/vdvideo"

[tool.setuptools]
# The project runs as a set of top-level modules/packages rather than a single
# importable distribution package; list what we ship explicitly.
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- #
# Tooling config (consolidated from ruff.toml / pytest.ini)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E402 (module import not at top) is intentional in a few places where import
# ordering matters (e.g. wiring ffmpeg before importing moviepy); those lines
# carry explicit `# noqa: E402`.
extend-select = ["E402", "I", "UP", "B"]
# Keep `class X(str, Enum)` (works on all 3.11+ without StrEnum); style choice.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# The Streamlit entrypoint must adjust sys.path before importing app modules.
"webui/Main.py" = ["E402"]
# main.py imports after the module docstring usage block.
"main.py" = ["E402"]
# video.py deliberately imports app.util.media *before* moviepy to wire ffmpeg
# first; keep that order (don't let import-sorting reshuffle it).
"app/services/video.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
